resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10 # Total peticiones
        failure-rate-threshold: 50 # Total errores permitidos en porcentaje
        wait-duration-in-open-state: 20s # Tiempo en estado Open, es decir mientras se recupera para continuar
        permitted-number-of-calls-in-half-open-state: 4 # Peticiones permitidas despues de la espero del Open
        slow-call-rate-threshold: 50 # Porcentaje de una petición que tarda cierto tiempo, el cual se especifica abajo
        slow-call-duration-threshold: 7s # Tiempo considerado demásiado para una petición
    instances:
      username:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 3s # Si pasa ese tiempo a diferencia de la otra propiedad esta lanza una excepción al primer retardo
    instances:
      username:
        base-config: default